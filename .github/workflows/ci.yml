name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  simulate:
    name: ngspice baseline check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ngspice and Python packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ngspice
          ngspice --version | sed -n 2p
          pip install numpy matplotlib

      # Schematic vs netlist, every netlist in ngspice, the README's headline
      # numbers, and loop stability. About 30 s; no figure is regenerated.
      - name: Baseline check
        run: python tools/ci_check.py

      # make_schematic.py ran above: the committed .asc / .asy must be what it writes.
      - name: Generated schematic is up to date
        run: git diff --exit-code -- simulations/ltspice/amp_channel_v1.asc simulations/ltspice/*.asy
